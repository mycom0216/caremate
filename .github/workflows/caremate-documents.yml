name: CareMate document exports
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/caremate-documents.yml'
      - 'projects/CareMate/docs/*.md'
      - 'projects/CareMate/tools/md2docx.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/CareMate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document tools
        run: |
          python -m pip install python-docx
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk
          mkdir -p "$HOME/.config/fontconfig/conf.d"
          printf '%s\n' '<fontconfig><alias><family>Malgun Gothic</family><prefer><family>Noto Sans CJK KR</family></prefer></alias></fontconfig>' > "$HOME/.config/fontconfig/conf.d/99-caremate.conf"
          fc-cache -f
      - name: Build updated documents
        run: |
          mkdir -p exports
          for name in CareMate_기획서 CareMate_결과보고서; do
            python tools/md2docx.py "docs/$name.md" "exports/$name.docx"
            libreoffice -env:UserInstallation=file:///tmp/caremate-lo --headless --convert-to pdf --outdir exports "exports/$name.docx"
            test -s "exports/$name.docx"
            test -s "exports/$name.pdf"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: caremate-updated-documents
          path: projects/CareMate/exports/
          if-no-files-found: error
